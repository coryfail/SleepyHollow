        <h1>Sleepy Hollow</h1>
        <p>
          Sleepy Hollow is an agentic-first headless API framework for Deno, the
          runtime that runs JavaScript and TypeScript outside the browser, with
          Specification-Governed Agentic Development built in. It is in
          development and published to JSR; the API is pre-1.0 and may change.
        </p>
        <p>
          Just like any human developer, an AI agent needs a set of procedures,
          best practices, and requirements to work against. The framework
          supplies them, so you can build endpoints rapidly without giving up
          the review you would demand from any other developer.
        </p>
        <p>
          It provides file-based routing, schema validation, typed Deno KV
          access, per-route security declarations, generated API contracts, and
          deployment. While your tests run it records what each handler actually
          did, and <code>hollow check</code> refuses to certify a route that
          carries approved criteria but that no test ever exercised.
        </p>
        <p>Add the framework to a project:</p>
        <pre><code>deno add jsr:@sleepy-hollow/framework</code></pre>
        <p>Install the CLI as hollow:</p>
        <pre><code>deno install -A --global --name hollow jsr:@sleepy-hollow/framework/cli</code></pre>
        <p>
          Sleepy Hollow is built through Specification-Governed Agentic
          Development, a method in which a human approves reviewed requirements,
          an agent implements only what they authorize, and evidence decides
          when the work is done.
        </p>
