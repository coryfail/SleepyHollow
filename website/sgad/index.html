        <h1>Specification-Governed Agentic Development</h1>
        <p>
          SGAD is a proposed open methodology for connecting human-approved
          behavioral intent, bounded agent work, and independently checkable
          evidence. You can use it without Sleepy Hollow.
        </p>
        <p>
          In practice: a developer writes down what the software should do in a
          file beside the code; a human approves that file exactly as written,
          bound to a fingerprint of its words; a machine checks that every
          promise in it has a test that failed before the code existed and
          passes now; and a finished change is the set of records that fit
          together, not a message saying it is done.
        </p>
        <p>
          Specify, approve, write acceptance tests, observe the expected red
          result, implement, verify independently, and deliver with evidence.
        </p>
        <p>
          Application-wide intent belongs in requirements/application.md,
          component requirements stay beside their behavior, and root
          requirements.md is reserved for repository-wide behavior.
        </p>
