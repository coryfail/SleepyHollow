name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/framework/**"
      - "docs/sgad/**"
      - "skills/sgad-workflow/**"
      - "skills/sleepy-hollow/**"
      - "*.req.md"
      - "**/*.req.md"
      - "models/**"
      - "cli/**"
      - "core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/framework/**"
      - "docs/sgad/**"
      - "skills/sgad-workflow/**"
      - "skills/sleepy-hollow/**"
      - "*.req.md"
      - "**/*.req.md"
      - "models/**"
      - "cli/**"
      - "core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install framework dependencies
        working-directory: .
        run: npm ci

      - name: Verify framework
        working-directory: .
        run: npm run verify

      - name: Install website dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Verify repository and website
        run: npm run verify

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
