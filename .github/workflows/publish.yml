name: Publish

# SH-F020 requires that publication proceed only from a revision whose own
# verification passes, whose tree is clean, and whose version is not already
# published. This workflow is where that gate is enforced, and publishing from
# Actions is also what lets JSR attest the artifact's provenance.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for JSR provenance: the OIDC token is what attests that this
      # artifact was built from this repository at this revision.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'deno.lock') }}

      - name: Verify governed approvals bind their content
        run: deno task check:governance

      - name: Verify framework
        run: deno task verify:framework

      - name: Verify capture
        run: deno task verify:capture

      - name: Verify project creation
        run: deno task verify:create

      - name: Verify independent project checking
        run: deno task verify:check

      - name: Verify CLI dispatch and diagnostics
        run: deno task verify:cli

      - name: Verify test command
        run: deno task verify:test-command

      - name: Verify development command
        run: deno task verify:dev

      - name: Verify evidence loading
        run: deno task verify:evidence

      - name: Verify deployment
        run: deno task verify:deploy

      - name: Verify planning workflow
        run: deno task verify:planning

      - name: Verify skill
        run: deno task verify:skill

      - name: Verify packaging
        run: deno task verify:packaging

      # AC-F020-001: the tag being released must name the version the package
      # declares, so a tag cannot publish a version other than the one in the
      # tree it points at.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared="$(deno eval --quiet \
            'const c = JSON.parse(await Deno.readTextFile("deno.json")); console.log(c.version)')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match declared version ${declared}." >&2
            echo "Raise the version in deno.json, or retag the intended revision." >&2
            exit 1
          fi
          echo "Releasing ${declared}."

      # AC-F020-007: a version already on the registry is never republished.
      # JSR versions are immutable, so this refuses before the upload rather
      # than failing partway through it.
      - name: Refuse a version that is already published
        run: |
          name="$(deno eval --quiet \
            'const c = JSON.parse(await Deno.readTextFile("deno.json")); console.log(c.name)')"
          version="$(deno eval --quiet \
            'const c = JSON.parse(await Deno.readTextFile("deno.json")); console.log(c.version)')"
          scope="${name%/*}"
          scope="${scope#@}"
          package="${name#*/}"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://jsr.io/api/scopes/${scope}/packages/${package}/versions/${version}")"
          case "$status" in
            200)
              echo "${name}@${version} is already published, and JSR versions are immutable." >&2
              echo "Raise the version before releasing again." >&2
              exit 1
              ;;
            404)
              echo "${name}@${version} is unpublished; proceeding."
              ;;
            *)
              # Anything else means the registry did not answer the question.
              # Treating that as "unpublished" would be a guess, so refuse.
              echo "JSR returned ${status} when asked about ${name}@${version}." >&2
              echo "The release gate cannot confirm the version is unused; refusing." >&2
              exit 1
              ;;
          esac

      # AC-F020-008: publishing refuses a dirty tree. A fresh checkout is clean
      # by construction, so this asserts nothing above generated a change.
      - name: Publish to JSR
        run: deno publish
