name: Publish

# SH-F020 requires that publication proceed only from a revision whose own
# verification passes, whose tree is clean, and whose version is not already
# published. This workflow is where that gate is enforced, and publishing from
# Actions is also what lets npm attest the artifact's provenance.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the OIDC token is what attests that this
      # artifact was built from this repository at this revision.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify framework
        run: npm run verify

      - name: Verify package contents
        run: npm run pack:check

      # AC-F020-001: the tag being released must name the version the package
      # declares, so a tag cannot publish a version other than the one in the
      # tree it points at.
      - name: Check the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared="$(node -p 'require("./package.json").version')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match declared version ${declared}." >&2
            echo "Raise the version in package.json, or retag the intended revision." >&2
            exit 1
          fi
          echo "Releasing ${declared}."

      # AC-F020-007: a version already on the registry is never republished.
      # npm versions are immutable, so this refuses before the upload rather
      # than failing partway through it.
      - name: Refuse a version that is already published
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if result="$(npm view "${name}@${version}" version --json 2>&1)"; then
            echo "${name}@${version} is already published, and npm versions are immutable." >&2
            echo "Raise the version before releasing again." >&2
            exit 1
          fi
          if ! printf '%s' "$result" | grep -q 'E404'; then
            echo "npm did not confirm whether ${name}@${version} is unused:" >&2
            printf '%s\n' "$result" >&2
            exit 1
          fi
          echo "${name}@${version} is unpublished; proceeding."

      # AC-F020-008: publishing refuses a dirty tree. A fresh checkout is clean
      # by construction, so this asserts nothing above generated a change.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
